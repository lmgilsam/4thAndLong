<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- App icon: full-bleed square (phones round the corners themselves). The ball stays inside
       the maskable safe zone (a circle 80% of the width) so Android can crop it to any shape. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#173322"/>
      <stop offset="1" stop-color="#050a07"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 256) rotate(-35) scale(6.4)">
    <ellipse rx="25" ry="14" fill="#8a4a24" stroke="#ffb627" stroke-width="3"/>
    <path d="M-13 0h26M-8 -4v8M-3 -4v8M2 -4v8M7 -4v8" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
  </g>
</svg>
